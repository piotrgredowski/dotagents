name: Update skills

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update skills from lockfile sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/update-skills.sh

      - name: Create pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-skills
          delete-branch: true
          commit-message: "chore(skills): update skills"
          title: "chore(skills): update skills"
          body: |
            Automated daily update of skills tracked in `.skill-lock.json`.

            This PR was created by the `Update skills` workflow.

      - name: Merge pull request
        if: steps.create-pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.create-pull-request.outputs.pull-request-number }}" --squash --delete-branch
